<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Hi y'all, I'm Muhammad Adilaga — Informatics Engineering Fresh Graduate">
  <style>
    .wave-back { animation: slide 16s linear infinite; }
    .wave-front { animation: slide 9s linear infinite; }
    @keyframes slide { to { transform: translateX(-600px); } }
    .dot { animation: twinkle 3.2s ease-in-out infinite; }
    .dot-drift { animation: drift 6s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .95; } }
    @keyframes drift {
      0% { transform: translateY(0); opacity: .2; }
      50% { opacity: .9; }
      100% { transform: translateY(-14px); opacity: .2; }
    }
    .sub { animation: softpulse 3.5s ease-in-out infinite; }
    @keyframes softpulse { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .wave-back, .wave-front, .dot, .dot-drift, .sub { animation: none !important; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="240" fill="#0b0b0b"/>

  <!-- Scattered lime dots -->
  <g fill="#b8f500">
    <circle class="dot" cx="170" cy="60" r="3.5" style="animation-delay:-.4s"/>
    <circle class="dot-drift" cx="255" cy="38" r="2.5" style="animation-delay:-1.2s"/>
    <circle class="dot" cx="300" cy="150" r="2.5" style="animation-delay:-2.1s"/>
    <circle class="dot-drift" cx="430" cy="95" r="3" style="animation-delay:-.8s"/>
    <circle class="dot" cx="520" cy="30" r="2.5" style="animation-delay:-2.8s"/>
    <circle class="dot-drift" cx="620" cy="140" r="3.5" style="animation-delay:-1.6s"/>
    <circle class="dot" cx="700" cy="55" r="2.5" style="animation-delay:-.2s"/>
    <circle class="dot-drift" cx="830" cy="120" r="3" style="animation-delay:-2.4s"/>
    <circle class="dot" cx="900" cy="40" r="3.5" style="animation-delay:-1.9s"/>
    <circle class="dot-drift" cx="1010" cy="150" r="2.5" style="animation-delay:-.6s"/>
    <circle class="dot" cx="1090" cy="70" r="3" style="animation-delay:-2.6s"/>
    <circle class="dot-drift" cx="1150" cy="110" r="2.5" style="animation-delay:-1.1s"/>
    <circle class="dot" cx="120" cy="180" r="3" style="animation-delay:-1.4s"/>
    <circle class="dot-drift" cx="60" cy="90" r="2.5" style="animation-delay:-2.2s"/>
    <circle class="dot" cx="960" cy="180" r="3" style="animation-delay:-.9s"/>
    <circle class="dot-drift" cx="380" cy="180" r="2.5" style="animation-delay:-1.7s"/>
  </g>

  <!-- Title -->
  <text x="600" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#ffffff">Hi y&#8217;all, I&#8217;m Muhammad Adilaga 🤝</text>

  <!-- Subtitle -->
  <text class="sub" x="600" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#b8f500">Informatics Engineering Fresh Graduate</text>

  <!-- Back wave (dark olive, slow) -->
  <g class="wave-back">
    <path fill="#223300" d="M -600 200 Q -525 188 -450 200 T -300 200 T -150 200 T 0 200 T 150 200 T 300 200 T 450 200 T 600 200 T 750 200 T 900 200 T 1050 200 T 1200 200 T 1350 200 T 1500 200 T 1650 200 T 1800 200 L 1800 240 L -600 240 Z"/>
  </g>

  <!-- Front wave (bright lime, faster) -->
  <g class="wave-front">
    <path fill="#b8f500" d="M -600 214 Q -525 200 -450 214 T -300 214 T -150 214 T 0 214 T 150 214 T 300 214 T 450 214 T 600 214 T 750 214 T 900 214 T 1050 214 T 1200 214 T 1350 214 T 1500 214 T 1650 214 T 1800 214 L 1800 240 L -600 240 Z"/>
  </g>
</svg>
